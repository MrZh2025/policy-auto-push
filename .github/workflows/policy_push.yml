name: 医药政策每日自动化监控与微信推送

on:
  schedule:
    # 北京时间 08:30 (UTC 00:30)
    - cron: '30 0 * * 1-5'
    # 北京时间 17:30 (UTC 09:30)
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-policy-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 3.12 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行政策采集、Word简报生成与微信推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || 'be87fdcbcef94066ab9132f5e8575005' }}
          WECHAT_WORK_WEBHOOK: ${{ secrets.WECHAT_WORK_WEBHOOK }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
        run: |
          python main.py

      - name: 上传 Word 简报附件到 GitHub Artifacts (供网页下载)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 医药产业政策每日监测简报-Word
          path: reports/*.docx
          retention-days: 30

      - name: 提交并持久化去重数据库与 Word 归档
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add policy_records.db policy_runner.log reports/*.docx || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: update policy db & reports [skip ci]" || true
            git pull --rebase origin main || true
            git push origin main || git push --force-with-lease origin main || true
          else
            echo "没有新增数据变更，无需提交。"
          fi
          exit 0
