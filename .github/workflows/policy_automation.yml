name: 医药产业政策每日监控与微信推送

on:
  schedule:
    # 每个工作日北京时间 08:30 (UTC 00:30)
    - cron: '30 0 * * 1-5'
    # 每个工作日北京时间 17:30 (UTC 09:30)
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  run-policy-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 3.12 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装 Python 依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行政策采集、Word公文简报生成与微信推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || 'be87fdcbcef94066ab9132f5e8575005' }}
          WECHAT_WORK_WEBHOOK: ${{ secrets.WECHAT_WORK_WEBHOOK }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
        run: |
          python main.py

      - name: 上传公文 Word 简报到 GitHub 制品区 (供一键下载)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 医药产业政策每日监测简报-Word
          path: reports/*.docx
          if-no-files-found: ignore
          retention-days: 30

      - name: 自动持久化政策去重数据库与 Word 归档及网页数据
        if: always()
        run: |
          set +e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add policy_records.db policy_runner.log reports/*.docx docs/data/*.json web/data/*.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: auto update policy database & pages data [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "数据库与网页数据同步流程已安全执行完毕。"
          exit 0
